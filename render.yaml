services:
  - type: web
    name: kawn-pulse-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Was "true" -- that made _safe_fetch() serve only mock data in
      # production regardless of what credentials were set below. Real
      # connectors (Bluesky/Mastodon/Wikipedia/HackerNews/DevTo/News/
      # Hashnode need no keys; Reddit/YouTube need the creds below) are
      # now wired into fetch_plan, so this needs to be false for them to
      # actually run.
      - key: ENABLE_MOCK_DATA
        value: "false"
      # Free web services have no persistent disk — /tmp is wiped on every
      # restart/redeploy/idle-spindown. Point this at a Neon (or similar)
      # free Postgres instead: postgresql+asyncpg://user:pass@host/dbname
      # (Render's own free Postgres expires 30 days after creation — Neon
      # doesn't). Set the real value as a dashboard secret, not here.
      - key: DATABASE_URL
        sync: false
      # Re-enabled: covers refreshes while the dyno is awake. It cannot fire
      # while asleep though — see the cron-tick endpoint below for that gap.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: REDDIT_USER_AGENT
        value: KawnPulseEngine/1.0
      - key: NEWS_RSS_FEEDS
        value: https://news.google.com/rss/search?q={query}
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Cloudflare R2 — heavy-fetch JSON cache (/sources/<source>/<topic>.json)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: kawn-pulse-cache
      # Shared secret for POST /internal/cron-tick. Point a free pinger
      # (e.g. cron-job.org) at that endpoint every 10 min with header
      # X-Cron-Secret: <this value> — it wakes the sleeping dyno *and*
      # drives a refresh pass, since the in-process APScheduler can't run
      # while the instance is spun down.
      - key: CRON_HEARTBEAT_SECRET
        sync: false
